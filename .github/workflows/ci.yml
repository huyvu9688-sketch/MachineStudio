name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # PostgreSQL service container so `prisma generate` (run automatically
    # by the "postinstall" script during `npm ci`) and the live database
    # health check in lib/db/health.test.ts (Unit 0.4 exit criterion) both
    # run against a real database in CI, matching docker-compose.yml's
    # local-development credentials.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: machinestudio
          POSTGRES_PASSWORD: machinestudio
          POSTGRES_DB: machinestudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U machinestudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://machinestudio:machinestudio@localhost:5432/machinestudio?schema=public"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # Dependency install and client generation are deliberately separate
      # steps so a failure names its phase instead of being buried in npm
      # output. `--ignore-scripts` suppresses the package.json "postinstall"
      # hook here only to avoid generating twice; the hook is what makes a
      # plain `npm install` work for a fresh clone. Prisma is the only
      # dependency in this project that relies on an install script.
      #
      # CI is currently the only environment that can run `prisma generate`
      # at all: the primary development machine sits behind corporate TLS
      # interception that blocks binaries.prisma.sh. See
      # context/progress-tracker.md "Open Questions".
      - name: Install dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate

      # Applies the committed migrations to the service container so the
      # live-database repository tests (project/graph/run-repository.test.ts)
      # have real tables to query, not just a reachable server. Without this
      # step "Test" fails with "relation does not exist" even though the
      # earlier steps (generate/lint/typecheck) all pass — discovered
      # 2026-07-30 when the Unit 2.1–2.3 push (6cfb90c) turned CI red: those
      # units were verified locally against a hand-provisioned database and
      # never re-checked against this workflow.
      - name: Deploy migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
