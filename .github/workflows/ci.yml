name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # PostgreSQL service container so `prisma generate` (run automatically
    # by the "postinstall" script during `npm ci`) and the live database
    # health check in lib/db/health.test.ts (Unit 0.4 exit criterion) both
    # run against a real database in CI, matching docker-compose.yml's
    # local-development credentials.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: machinestudio
          POSTGRES_PASSWORD: machinestudio
          POSTGRES_DB: machinestudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U machinestudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://machinestudio:machinestudio@localhost:5432/machinestudio?schema=public"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # Split from the old single "Install dependencies" step (which ran
      # `npm ci` with the "postinstall" hook enabled) so a CI failure names
      # exactly which phase failed: plain dependency installation, or the
      # `prisma generate` binary download. This is a temporary diagnostic
      # split — see context/progress-tracker.md "Open Questions" for why:
      # the previous single step failed twice in a row here with no
      # accessible log detail.
      - name: Install dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
