name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # PostgreSQL service container so `prisma generate` (run automatically
    # by the "postinstall" script during `npm ci`) and the live database
    # health check in lib/db/health.test.ts (Unit 0.4 exit criterion) both
    # run against a real database in CI, matching docker-compose.yml's
    # local-development credentials.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: machinestudio
          POSTGRES_PASSWORD: machinestudio
          POSTGRES_DB: machinestudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U machinestudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://machinestudio:machinestudio@localhost:5432/machinestudio?schema=public"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # Dependency install and client generation are deliberately separate
      # steps so a failure names its phase instead of being buried in npm
      # output. `--ignore-scripts` suppresses the package.json "postinstall"
      # hook here only to avoid generating twice; the hook is what makes a
      # plain `npm install` work for a fresh clone. Prisma is the only
      # dependency in this project that relies on an install script.
      #
      # CI is currently the only environment that can run `prisma generate`
      # at all: the primary development machine sits behind corporate TLS
      # interception that blocks binaries.prisma.sh. See
      # context/progress-tracker.md "Open Questions".
      - name: Install dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate

      # Applies the committed migrations to the service container so the
      # live-database repository tests (project/graph/run-repository.test.ts)
      # have real tables to query, not just a reachable server. Without this
      # step "Test" fails with "relation does not exist" even though the
      # earlier steps (generate/lint/typecheck) all pass — discovered
      # 2026-07-30 when the Unit 2.1–2.3 push (6cfb90c) turned CI red: those
      # units were verified locally against a hand-provisioned database and
      # never re-checked against this workflow.
      - name: Deploy migrations
        run: npx prisma migrate deploy

      # Audits what actually ships. `--omit=dev` is deliberate: the current
      # remaining advisories are all in ESLint's dependency tree (a
      # brace-expansion DoS reachable only by feeding a malicious pattern to a
      # local lint run), and clearing them needs a breaking ESLint major, so
      # gating on them would either block CI or invite a blanket ignore.
      # Production dependencies must stay clean — `package.json` "overrides"
      # forces the patched postcss and sharp that Next has not yet released;
      # re-check those pins on every Next upgrade.
      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Unit 0.3's E2E smoke test. Runs against `next dev`, not the
      # production build above (see playwright.config.ts). `--with-deps`
      # installs the OS libraries Chromium needs on the runner image, not
      # only the browser binary — this step could not be verified on the
      # primary dev machine, where a group policy blocks execution of any
      # freshly downloaded browser binary (the same class of
      # corporate-endpoint restriction already documented for
      # binaries.prisma.sh).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Diagnostic step for the webServer-never-becomes-ready failures on
      # 282200d/49c1038/5659bfb (see context/progress-tracker.md): the
      # `job logs` and `actions/runs/.../logs` REST endpoints both return 403
      # "Must have admin rights" for an unauthenticated request, and this
      # session has no GitHub token — every prior fix attempt was root-caused
      # by exact-timeout pattern matching and local repro alone, with zero
      # visibility into what actually happened in the CI container. This
      # writes `npm run test:e2e`'s full output (which already includes
      # `next dev`'s piped stdout/stderr per playwright.config.ts) to a file
      # and uploads it as a build artifact — artifact downloads may not be
      # gated by the same permission check as log downloads, worth testing
      # before concluding this genuinely needs a human with repository access
      # to read.
      # Clerk test-instance secrets, scoped to this step only. When unset
      # (a fork PR, or before these repository secrets are configured —
      # see context/progress-tracker.md), e2e/clerk-global-setup.ts and
      # e2e/authenticated.spec.ts both no-op/self-skip rather than fail.
      - name: E2E smoke test
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
        # `set -o pipefail`: without it, `bash -e {0}` (this runner's default
        # shell) only inspects the pipeline's last command (`tee`, which
        # itself always succeeds), so a failing `npm run test:e2e` could not
        # fail this step at all — a release audit found this exact gap.
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /tmp/e2e-output.log

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            /tmp/e2e-output.log
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
